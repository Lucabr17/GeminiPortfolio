name: Run Gemini AI Fund Manager

on:
  schedule:
    # 13:00 UTC (Pre-Market Scan) -> Monday to Friday
    - cron: '0 13 * * 1-5'
    # 20:15 UTC (After-Close Scan) -> Monday to Friday
    - cron: '15 20 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it via a button

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission to update portfolio.json

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Quant Framework Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lxml yfinance pandas google-genai requests tzdata

    - name: Run Matrix Script Engine
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python autopilot.py --single-run

    - name: Commit and Save Portfolio Records
      run: |
        git config --global user.name "Gemini-Autopilot-Bot"
        git config --global user.email "actions@github.com"
        git add portfolio.json agent.log
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Autopilot] Portfolio state ledger updated via cloud execution" && git push)
        - name: Commit and push updated portfolio
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add portfolio.json agent.log
          git commit -m "🤖 Auto-update portfolio and logs" || echo "No changes to commit"
          git push

# .github/workflows/nav-history.yml
# Records one NAV point per weekday after the US close and commits it to
# nav_history.json (the data source for the dashboard's NAV chart).
# Drop this file in .github/workflows/ alongside your autopilot workflow,
# and put record_nav.py in the repo root. No other files change.

name: Record NAV history

on:
  schedule:
    # 22:30 UTC, Mon–Fri. US market closes 20:00 UTC (summer) / 21:00 UTC
    # (winter), so this runs after the close. GitHub cron is UTC and can be
    # delayed a few minutes — fine for a daily-close snapshot. Adjust if you
    # want it to run strictly after your autopilot job (or trigger on
    # workflow_run of that job instead — see the note at the bottom).
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit nav_history.json back

concurrency:
  group: nav-history       # never let two of these overlap
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install --quiet yfinance

      - name: Record today's NAV
        run: python record_nav.py

      - name: Commit nav_history.json
        run: |
          git config user.name  "nav-history-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav_history.json
          if git diff --staged --quiet; then
            echo "No NAV change to commit (weekend or unchanged)."
          else
            # rebase in case the autopilot job pushed portfolio.json meanwhile
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git commit -m "chore: record NAV $(TZ=America/New_York date +%F)"
            git push
          fi

# ── Alternative trigger (more precise) ────────────────────────────────
# If you'd rather record RIGHT AFTER your autopilot run (using the exact
# portfolio.json it just committed), replace the `schedule:` block above
# with this, using your autopilot workflow's real `name:` value:
#
# on:
#   workflow_run:
#     workflows: ["YOUR AUTOPILOT WORKFLOW NAME"]
#     types: [completed]
#   workflow_dispatch: {}
